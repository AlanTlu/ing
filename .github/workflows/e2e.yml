name: ING_REGRUTACJA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cookie-consent:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ING_REGRUTACJA
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ING_REGRUTACJA/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Install ${{ matrix.browser }} with system dependencies
        run: >-
          ./mvnw --batch-mode --no-transfer-progress exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps ${{ matrix.browser }}"

      - name: Run test in ${{ matrix.browser }}
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -Dbrowser=${{ matrix.browser }} clean test

      - name: Upload reports, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ing-cookie-${{ matrix.browser }}
          path: |
            ING_REGRUTACJA/target/surefire-reports/
            ING_REGRUTACJA/target/artifacts/
          if-no-files-found: warn
          retention-days: 14
